<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Admin — Conecta Delivery</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --red: #EA1D2C;
    --bg: #f0f1f3;
    --card: #fff;
    --border: #e5e7eb;
    --text: #111;
    --muted: #6b7280;
    --sidebar: #111;
    --sidebar-w: 248px;
  }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
  }
  body.admin-locked { overflow: hidden; }

  /* LOGIN */
  .admin-login {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.25rem;
    background: radial-gradient(circle at top, #2a2a2a 0%, #111 55%), #111;
  }
  .admin-login.hidden { display: none; }
  .admin-login-box {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border-radius: 20px;
    padding: 1.5rem 1.25rem 1.4rem;
    text-align: center;
    box-shadow: 0 18px 50px rgba(0,0,0,0.35);
  }
  .admin-login-box img {
    width: 72px; height: 72px;
    object-fit: contain;
    margin-bottom: 0.6rem;
  }
  .admin-login-box h1 { font-size: 1.25rem; font-weight: 800; margin-bottom: 0.3rem; }
  .admin-login-box .sub { font-size: 0.84rem; color: var(--muted); margin-bottom: 1rem; }

  /* DASHBOARD SHELL */
  .admin-app { display: none; min-height: 100dvh; }
  .admin-app.open {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    min-height: 100dvh;
  }

  .admin-sidebar {
    background: var(--sidebar);
    color: #fff;
    display: flex;
    flex-direction: column;
    padding: 1.1rem 0.85rem;
    position: sticky;
    top: 0;
    height: 100dvh;
  }
  .admin-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0.35rem 0.55rem 1.1rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 0.9rem;
  }
  .admin-brand img {
    width: 40px; height: 40px;
    border-radius: 10px;
    object-fit: contain;
    background: #fff;
  }
  .admin-brand strong {
    display: block;
    font-size: 0.92rem;
    font-weight: 800;
  }
  .admin-brand span {
    display: block;
    font-size: 0.68rem;
    color: #9ca3af;
    margin-top: 2px;
  }

  .admin-tabs {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }
  .admin-tab {
    width: 100%;
    border: none;
    background: transparent;
    color: #d1d5db;
    border-radius: 12px;
    padding: 12px 14px;
    font-family: inherit;
    font-weight: 800;
    font-size: 0.88rem;
    cursor: pointer;
    text-align: left;
    transition: 0.15s ease;
  }
  .admin-tab:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .admin-tab.active {
    background: #fff;
    color: #111;
  }

  .admin-sidebar-foot {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-top: 0.85rem;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .admin-link-btn,
  .admin-out-btn {
    border: none;
    border-radius: 12px;
    padding: 11px 14px;
    font-family: inherit;
    font-weight: 800;
    font-size: 0.8rem;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
  }
  .admin-link-btn { background: var(--red); color: #fff; }
  .admin-out-btn { background: rgba(255,255,255,0.1); color: #fff; }

  .admin-main {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100dvh;
  }
  .admin-main-head {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .admin-main-head h1 {
    font-size: 1.2rem;
    font-weight: 800;
  }
  .admin-main-head p {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 2px;
  }
  .admin-menu-toggle {
    display: none;
    border: 1.5px solid var(--border);
    background: #fff;
    border-radius: 10px;
    width: 42px;
    height: 42px;
    font-size: 1.2rem;
    cursor: pointer;
    flex-shrink: 0;
  }

  .admin-body {
    flex: 1;
    padding: 1.25rem;
    width: 100%;
    max-width: 960px;
  }

  /* DASHBOARD CARDS */
  .dash-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 1rem;
  }
  .dash-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1rem 1.05rem;
  }
  .dash-card .label {
    font-size: 0.72rem;
    font-weight: 800;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .dash-card .value {
    font-size: 1.7rem;
    font-weight: 800;
    margin-top: 0.35rem;
    line-height: 1.1;
  }
  .dash-card .meta {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 0.35rem;
  }
  .dash-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .dash-action {
    border: 1.5px solid var(--border);
    background: #fff;
    border-radius: 14px;
    padding: 14px;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
  }
  .dash-action strong {
    display: block;
    font-size: 0.9rem;
    font-weight: 800;
  }
  .dash-action small {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-size: 0.72rem;
  }

  .admin-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .admin-section h3 {
    font-size: 1rem;
    font-weight: 800;
    margin-bottom: 0.65rem;
  }
  .admin-subh {
    margin: 1rem 0 0.4rem;
    font-size: 0.9rem;
    font-weight: 800;
  }
  .admin-hint {
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 0.75rem;
    line-height: 1.4;
  }
  .admin-label {
    display: block;
    font-size: 0.72rem;
    font-weight: 800;
    color: #555;
    margin: 0.55rem 0 0.28rem;
    text-align: left;
  }
  .admin-input {
    width: 100%;
    border: 1.5px solid #e6e6e6;
    border-radius: 12px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 0.9rem;
    background: #fff;
  }
  .admin-textarea { resize: vertical; min-height: 72px; }
  .admin-row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 0.35rem;
  }
  .admin-check {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0.55rem 0;
    font-size: 0.85rem;
    font-weight: 700;
    color: #333;
  }
  .admin-btn-primary,
  .admin-btn-secondary,
  .admin-btn-danger,
  .admin-btn-link {
    width: 100%;
    margin-top: 0.7rem;
    border: none;
    border-radius: 12px;
    padding: 12px 14px;
    font-family: inherit;
    font-weight: 800;
    font-size: 0.88rem;
    cursor: pointer;
  }
  .admin-btn-primary { background: var(--red); color: #fff; }
  .admin-btn-secondary { background: #f0f0f0; color: #222; }
  .admin-btn-danger { background: #ffe8e8; color: #c0392b; }
  .admin-btn-link {
    width: auto;
    background: none;
    color: #555;
    padding: 0;
    margin: 0 0 0.5rem;
    text-align: left;
  }
  .admin-list { display: flex; flex-direction: column; gap: 10px; margin: 0.6rem 0; }
  .admin-card {
    border: 1.5px solid #ebebeb;
    border-radius: 14px;
    padding: 12px;
    background: #fff;
  }
  .admin-item-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    text-align: left;
    border: 1.5px solid #ebebeb;
    border-radius: 14px;
    padding: 12px 14px;
    background: #fff;
    cursor: pointer;
    font-family: inherit;
  }
  .admin-item-row strong { display: block; font-size: 0.9rem; }
  .admin-item-row small { color: #777; font-size: 0.72rem; }
  .admin-chevron { font-size: 1.2rem; color: #aaa; }
  .admin-hr { border: none; border-top: 1px solid #eee; margin: 1.1rem 0; }
  .admin-pin-msg {
    color: #c0392b;
    font-size: 0.78rem;
    font-weight: 700;
    min-height: 1.1em;
    margin: 0.4rem 0;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(20px);
    background: #1a1a1a;
    color: #fff;
    padding: 10px 16px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.82rem;
    opacity: 0;
    pointer-events: none;
    transition: 0.25s ease;
    z-index: 50;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .admin-sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 30;
  }

  @media (max-width: 820px) {
    .admin-app.open { grid-template-columns: 1fr; }
    .admin-menu-toggle { display: inline-flex; align-items: center; justify-content: center; }
    .admin-sidebar {
      position: fixed;
      left: 0; top: 0;
      width: min(280px, 86vw);
      z-index: 40;
      transform: translateX(-105%);
      transition: transform 0.22s ease;
    }
    body.sidebar-open .admin-sidebar { transform: translateX(0); }
    body.sidebar-open .admin-sidebar-backdrop { display: block; }
    .dash-grid { grid-template-columns: 1fr 1fr; }
    .dash-actions { grid-template-columns: 1fr; }
  }
</style>
</head>
<body data-admin-page="1">

<div class="admin-login" id="adminGate">
  <div class="admin-login-box">
    <img src="Logo.png" alt="Conecta Delivery">
    <h1>Painel Admin</h1>
    <p class="sub">Acesso do propriet&#225;rio para gerenciar o card&#225;pio.</p>
    <label class="admin-label" for="adminPinInput">Senha</label>
    <input class="admin-input" id="adminPinInput" type="password" inputmode="numeric" maxlength="12" placeholder="Senha" autocomplete="current-password">
    <p class="admin-pin-msg" id="adminPinMsg" role="status"></p>
    <button type="button" class="admin-btn-primary" id="adminEntrarBtn">Entrar</button>
    <a class="admin-btn-secondary" href="index.html" style="display:block;text-align:center;text-decoration:none;line-height:1.2;padding-top:12px;padding-bottom:12px">Voltar ao menu</a>
    <p class="admin-hint" style="margin-top:0.9rem">Demo: senha <strong>1234</strong></p>
  </div>
</div>

<div class="admin-sidebar-backdrop" id="adminSidebarBackdrop"></div>

<div class="admin-app" id="adminApp">
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="admin-brand">
      <img src="Logo.png" alt="">
      <div>
        <strong>Conecta Admin</strong>
        <span>Painel do propriet&#225;rio</span>
      </div>
    </div>
    <nav class="admin-tabs" role="tablist">
      <button type="button" class="admin-tab active" data-tab="dashboard">Dashboard</button>
      <button type="button" class="admin-tab" data-tab="loja">Loja</button>
      <button type="button" class="admin-tab" data-tab="entrega">Entrega</button>
      <button type="button" class="admin-tab" data-tab="cardapio">Card&#225;pio</button>
      <button type="button" class="admin-tab" data-tab="senha">Senha</button>
    </nav>
    <div class="admin-sidebar-foot">
      <a class="admin-link-btn" href="index.html" target="_blank" rel="noopener">Ver menu</a>
      <button type="button" class="admin-out-btn" id="adminSairBtn">Sair</button>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-main-head">
      <button type="button" class="admin-menu-toggle" id="adminMenuToggle" aria-label="Abrir menu">&#9776;</button>
      <div>
        <h1 id="adminPageTitle">Dashboard</h1>
        <p id="adminPageSub">Vis&#227;o geral do estabelecimento</p>
      </div>
    </header>
    <main class="admin-body" id="adminBody"></main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="admin.js?v=6"></script>
<script>
  function showToast(msg) {
    const t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }
  window.showToast = showToast;

  document.getElementById('adminMenuToggle')?.addEventListener('click', () => {
    document.body.classList.toggle('sidebar-open');
  });
  document.getElementById('adminSidebarBackdrop')?.addEventListener('click', () => {
    document.body.classList.remove('sidebar-open');
  });

  if (window.MenuAdmin) window.MenuAdmin.bootPage();
</script>
</body>
</html>
